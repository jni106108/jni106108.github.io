<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2d44">
<title>Lancer Garagem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="cena"></div>
  <div id="pinos" aria-hidden="true"></div>
  <div id="rotulo" class="rotulo" hidden></div>

  <header class="barra">
    <button class="marca" data-acao="livrete" title="Livrete de manutenção">
      <img class="marca-logo" src="icones/icone-192.png" alt="" aria-hidden="true">
      <span class="marca-txt"><b id="apelido">Lancer GT</b><small id="km-atual">— km</small></span>
      <svg class="marca-livro" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>
    </button>
    <div class="barra-dir">
      <button class="ico" data-acao="zonas" title="Todas as zonas">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="ico" data-acao="menu" title="Menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </div>
  </header>

  <!-- Menu deslizante de regiões (arraste para os lados) -->
  <nav id="carrossel" class="carrossel" aria-label="Regiões do carro">
    <button class="car-seta" data-passo="-1" aria-label="Região anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="car-pista" data-pista>
      <span class="car-vizinho esq" data-viz="-1"></span>
      <button class="car-titulo" title="Toque para enquadrar · arraste para trocar"><small></small><b></b></button>
      <span class="car-vizinho dir" data-viz="1"></span>
    </div>
    <button class="car-seta" data-passo="1" aria-label="Próxima região"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="car-pontos" data-pontos></div>
  </nav>
  <div id="chips" class="chips"></div>

  <!-- Alternância de visualização (canto inferior esquerdo; no futuro vira filtro de camadas) -->
  <div class="seg modo-switch" role="tablist" aria-label="Modo de visualização">
    <button role="tab" class="ativo" data-modo="ext">Carroceria</button>
    <button role="tab" data-modo="int">Mecânica</button>
  </div>

  <div id="dica" class="dica">Toque numa peça ou deslize o menu acima</div>
  <button id="lembrete-chip" class="lembrete-chip" data-acao="livrete" hidden></button>

  <aside id="painel" class="painel" aria-live="polite" hidden></aside>
  <div id="livrete" class="livrete" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="carregando" class="carregando">Carregando catálogo e modelo 3D…</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
