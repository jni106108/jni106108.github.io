<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2d44">
<title>Lancer Club 67</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- identidade visual: arquivos em marca/ (para trocar o logo, substitua os arquivos mantendo os nomes) -->
<link rel="icon" type="image/png" sizes="48x48" href="marca/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="marca/icone-192.png">
<link rel="apple-touch-icon" href="marca/apple-touch-180.png">
<meta name="apple-mobile-web-app-title" content="Lancer Club 67">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // aplica o tema salvo antes de desenhar a página (evita piscar claro → escuro)
  try { const t = JSON.parse(localStorage.getItem('lancer-garagem.v1') || '{}').config?.tema;
    if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark'; } catch (e) {}
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="cena"></div>
  <div id="pinos" aria-hidden="true"></div>
  <div id="rotulo" class="rotulo" hidden></div>

  <header class="barra">
    <!-- Painel superior (como o painel de instrumentos): menu do veículo, hodômetro, abastecimento e luzes de alerta -->
    <div class="cluster" id="cluster">
      <div class="veic" id="veic">
        <button class="marca" data-acao="menu-veiculo" aria-expanded="false" aria-controls="veic-lista" title="Meu veículo">
          <span class="marca-ico"><svg viewBox="0 0 24 24"><path d="M3.5 14.5l1.8-4.6a2 2 0 0 1 1.9-1.3h9.6a2 2 0 0 1 1.9 1.3l1.8 4.6"/><path d="M2.5 14.5h19v3.2h-19z"/><circle cx="7" cy="17.7" r="1.7"/><circle cx="17" cy="17.7" r="1.7"/></svg></span>
          <svg class="marca-seta" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="veic-lista" id="veic-lista" hidden></div>
      </div>
      <div class="odo-caixa" id="odo-caixa">
        <button class="odometro" id="odometro" title="Hodômetro · toque e segure para editar"></button>
        <div class="odo-pop" id="odo-pop" hidden></div>
      </div>
      <button class="bomba-btn" data-acao="abastecer" title="Registrar abastecimento">
        <svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13M6.5 7h6v4h-6z"/><path d="M15 9h1.5a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8.5L18.5 5.5"/></svg>
      </button>
      <!-- luzes de alerta: se não couberem ao lado do hodômetro, descem para uma linha própria (o painel cresce) -->
      <div class="luzes" id="luzes">
        <div class="luzes-pista" id="luzes-pista" role="list" aria-label="Alertas de manutenção e documentos"></div>
      </div>
    </div>
    <div class="barra-dir">
      <button class="ico" data-acao="config" title="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Menu deslizante de regiões (arraste para os lados) -->
  <nav id="carrossel" class="carrossel" aria-label="Regiões do carro">
    <button class="car-seta" data-passo="-1" aria-label="Região anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="car-pista" data-pista>
      <span class="car-vizinho esq" data-viz="-1"></span>
      <button class="car-titulo" title="Toque para enquadrar · arraste para trocar"><small></small><b></b></button>
      <span class="car-vizinho dir" data-viz="1"></span>
    </div>
    <button class="car-seta" data-passo="1" aria-label="Próxima região"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="car-pontos" data-pontos></div>
  </nav>
  <div id="chips" class="chips"></div>

  <!-- Barra inferior: filtro de camadas (abre para cima), catálogo, manual e personalização -->
  <div class="filtro" id="filtro">
    <div class="filtro-lista" id="filtro-lista" role="listbox" aria-label="Filtrar sistemas" hidden></div>
    <div class="perso-lista" id="perso-lista" hidden></div>
    <div class="filtro-linha">
      <button class="filtro-btn" data-acao="filtro" aria-expanded="false" aria-controls="filtro-lista" title="Filtrar sistemas"></button>
      <button class="ico" data-acao="catalogo" title="Catálogo de peças">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      </button>
      <a class="ico" id="link-manual" target="_blank" rel="noopener" title="Manual do proprietário">
        <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6M9 10.5h6"/></svg>
      </a>
      <button class="ico" data-acao="personalizar" aria-expanded="false" aria-controls="perso-lista" title="Personalizar o carro">
        <svg viewBox="0 0 24 24"><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8 9.2 12z"/><path d="M9.2 12c-2.5 0-4.2 1.8-4.2 4.2 0 1.6-1.1 2.8-2.5 3.3 1.4 1 3.2 1.5 5 1.5 3.4 0 4.5-2.4 4.5-4.2z"/></svg>
      </button>
    </div>
  </div>

  <div id="dica" class="dica">Toque numa peça ou deslize o menu acima</div>

  <aside id="painel" class="painel" aria-live="polite" hidden></aside>
  <div id="livrete" class="livrete" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="carregando" class="carregando">
    <div class="carr-caixa">
      <img class="carr-logo" src="marca/abertura.png" alt="Lancer Club 67">
      <b>Lancer Club 67</b>
      <span id="carregando-txt">Carregando catálogo e modelo 3D…</span>
      <div class="carr-barra"><i id="carregando-barra"></i></div>
      <div id="carregando-erro" class="carr-erro" hidden></div>
    </div>
  </div>

  <script>
    // Rede de segurança da abertura: se algo falhar (ou demorar demais), mostra o motivo e botões para tentar
    // de novo, em vez de ficar parado em "Carregando…". Os dados do usuário (localStorage, fotos) nunca são apagados aqui.
    (function () {
      function aviso(msg) {
        var c = document.getElementById('carregando'), e = document.getElementById('carregando-erro');
        if (!c || !e || c.classList.contains('some')) return;
        e.hidden = false;
        e.innerHTML = '<p></p><div><button type="button" data-x="recarregar">Tentar de novo</button>' +
          '<button type="button" data-x="limpar">Limpar cache e recarregar</button></div><small>Seus registros, fotos e configurações não são apagados.</small>';
        e.querySelector('p').textContent = msg;
      }
      window.lancerAviso = aviso;
      // Descobre qual arquivo falhou: baixa cada um (erro 404 = faltando no GitHub) e importa os módulos
      // que não têm efeito colateral (revela erro de código ou arquivo de versão diferente).
      function diagnosticar() {
        aviso('Não foi possível abrir o app. Verificando os arquivos…');
        var arqs = ['js/main.js', 'js/carro3d.js', 'js/zonas.js', 'js/dados.js', 'js/anexos.js', 'css/app.css', 'data/catalogo.json',
          'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'];
        Promise.all(arqs.map(function (a) {
          return fetch(a, { cache: 'no-store' }).then(function (r) { return r.ok ? null : a + ' (erro ' + r.status + (r.status === 404 ? ': não existe no site' : '') + ')'; },
            function () { return a + ' (sem conexão)'; });
        })).then(function (falhas) {
          falhas = falhas.filter(Boolean);
          if (falhas.length) return aviso('Arquivo(s) com problema: ' + falhas.join(' · ') + '. Confira se estão no GitHub, na pasta certa e com o nome em letras minúsculas.');
          var mods = ['./js/anexos.js', './js/zonas.js', './js/dados.js', './js/carro3d.js'];
          return Promise.all(mods.map(function (m) { return import(m).then(function () { return null; }, function (e) { return m.slice(2) + ': ' + e.message; }); }))
            .then(function (erros) {
              erros = erros.filter(Boolean);
              aviso(erros.length ? 'Erro no código: ' + erros.join(' · ') + '. Provavelmente um arquivo ficou de uma versão anterior: reenvie todos os arquivos da pasta js.'
                : 'Os arquivos existem, mas o main.js não abriu. Ele pode ser de uma versão diferente dos outros: reenvie todos os arquivos da pasta js.');
            });
        });
      }
      // arquivo de script que não carregou (sem internet, arquivo faltando no GitHub…)
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && t.tagName === 'SCRIPT') diagnosticar();
        else if (t === window || !t) aviso('Erro ao abrir: ' + (ev.message || 'desconhecido') + (ev.filename ? ' (' + ev.filename.split('/').pop() + ':' + ev.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason; aviso('Erro ao abrir: ' + ((r && (r.message || r)) || 'desconhecido'));
      });
      // demorando demais: o carregamento continua, mas os botões aparecem
      setTimeout(function () { aviso('Está demorando mais que o normal. Se a internet estiver lenta, aguarde; senão, tente de novo.'); }, 45000);
      document.addEventListener('click', function (ev) {
        var b = ev.target.closest && ev.target.closest('[data-x]'); if (!b) return;
        if (b.dataset.x === 'recarregar') return location.reload();
        // apaga só o cache de arquivos do app (código, modelo 3D) e o service worker; os dados ficam
        var tarefas = [];
        if (window.caches) tarefas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        if (navigator.serviceWorker) tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        b.textContent = 'Limpando…';
        Promise.all(tarefas).catch(function () {}).then(function () { location.reload(); });
      });
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
